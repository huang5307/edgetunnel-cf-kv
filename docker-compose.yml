services:
  cf-kv-updater:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: cf-kv-updater
    restart: unless-stopped
    network_mode: host
    environment:
      - CF_ACCOUNT_ID=CF账号
      - CF_KV_NAMESPACE_ID=填自己的
      - CF_API_TOKEN=cfut_填自己的
      - CF_KV_KEY=PREFERRED_ADDR
      - TOP_NODES_COUNT=8
      # 設定每天 16:00 執行 (標準 Cron 表達式: 分 時 日 月 週)
      - CRON_SCHEDULE=0 16 * * *
    volumes:
      - /etc/localtime:/etc/localtime:ro
